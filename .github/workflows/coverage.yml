name: Run Django Tests with Coverage

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 'meeting_scheduler/requirements*.txt'

      - name: Install dependencies
        run: |
          cd meeting_scheduler
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          cd meeting_scheduler
          set -e
          pytest --cov=calendar_app --cov-report=xml --cov-report=term-missing --junitxml=pytest.xml || {
            code=$?
            if [ "$code" -eq 5 ]; then
              echo "No tests collected. Treating as success for CI."
              exit 0
            else
              exit $code
            fi
          }

      - name: Parse test results and coverage
        if: github.event_name == 'pull_request'
        id: test-results
        run: |
          cd meeting_scheduler
          TOTAL=$(grep -oP 'tests="\K[0-9]+' pytest.xml | head -1)
          SKIPPED=$(grep -oP 'skipped="\K[0-9]+' pytest.xml | head -1 || echo "0")
          FAILURES=$(grep -oP 'failures="\K[0-9]+' pytest.xml | head -1 || echo "0")
          ERRORS=$(grep -oP 'errors="\K[0-9]+' pytest.xml | head -1 || echo "0")
          PASSED=$((TOTAL - SKIPPED - FAILURES - ERRORS))
          TIME=$(grep -oP 'time="\K[0-9.]+' pytest.xml | head -1)
          COVERAGE=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(round(float(root.attrib['line-rate']) * 100, 1))")

          # Generate per-file coverage using coverage report
          FILE_COV_RAW=$(python3 -m coverage report)

          # Format as markdown table
          echo "file_coverage<<EOF" >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          echo "$FILE_COV_RAW" >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "failures=$FAILURES" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "time=$TIME" >> $GITHUB_OUTPUT
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Post test results comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pytest-coverage
          message: |
            ## Test Results

            | Tests | Passed | Skipped | Failures | Errors | Time |
            |-------|--------|---------|----------|--------|------|
            | ${{ steps.test-results.outputs.total }} | ${{ steps.test-results.outputs.passed }} | ${{ steps.test-results.outputs.skipped }} | ${{ steps.test-results.outputs.failures }} | ${{ steps.test-results.outputs.errors }} | ${{ steps.test-results.outputs.time }}s |

            ## Coverage: ${{ steps.test-results.outputs.coverage }}%

            **Coverage Requirement:** 80%+ overall

            ### Per-File Coverage

            ${{ steps.test-results.outputs.file_coverage }}

            <details>
            <summary>View Details</summary>

            **Commit:** `${{ github.event.pull_request.head.sha }}`
            **Run:** [View Full Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            </details>

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            meeting_scheduler/coverage.xml
            meeting_scheduler/pytest.xml
            meeting_scheduler/htmlcov/
          if-no-files-found: ignore

      - name: Check coverage threshold
        run: |
          cd meeting_scheduler
          python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); coverage = round(float(root.attrib['line-rate']) * 100, 1); print(f'Coverage: {coverage}%'); exit(1) if coverage < 80 else print('Coverage meets 80% requirement')"
