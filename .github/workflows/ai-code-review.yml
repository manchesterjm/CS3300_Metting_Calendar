name: AI Code Review

on:
  pull_request:
    # Only run when code or docs likely to be reviewed have changed
    paths:
      - "**/*.py"
      - "**/*.md"
      - "**/*.html"
      - "**/*.js"
      - "**/*.ts"
      - ".github/workflows/ai-code-review.yml"
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review changes with OpenAI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Optional: show basic diff stats in the run log
      - name: Show changed files
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1 || true
          git diff --name-status origin/${{ github.base_ref }}... | sed -e 's/^/  /' || true

      # Main review
      - name: AI Code Review
        uses: anc95/ChatGPT-CodeReview@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_ENDPOINT: https://api.openai.com/v1
          # Using GPT-4 Turbo for reliable code review capabilities
          MODEL: ${{ secrets.OPENAI_MODEL != '' && secrets.OPENAI_MODEL || 'gpt-4-turbo' }}
          PROMPT: |
            You are a senior Django developer conducting a thorough code review. For EVERY file changed, you MUST provide detailed analysis.

            For each changed file, explicitly discuss:
            1) **Code Quality**: Evaluate Django best practices, PEP 8 compliance, code organization, and readability
            2) **Potential Issues**: Identify bugs, edge cases, error handling gaps, or logic flaws
            3) **Security**: Check for vulnerabilities (SQL injection, XSS, CSRF, auth issues, data exposure)
            4) **Performance**: Analyze database queries (N+1 problems), caching opportunities, algorithm efficiency
            5) **Testing**: Assess test coverage, test quality, and missing test cases
            6) **Suggestions**: Provide specific, actionable improvements with code examples where helpful

            IMPORTANT:
            - Even if code is excellent, explain WHY it's good and what was done well
            - Reference specific line numbers for all comments
            - Provide code snippets for suggested improvements
            - If you see test files, comment on test quality and coverage
            - Never just say "LGTM" - always provide substantive analysis
            - Be constructive and educational in your feedback
          # Newer models expect 'max_completion_tokens' rather than 'max_tokens'
          max_completion_tokens: "8000"
          top_p: "1"
          temperature: "0.7"
