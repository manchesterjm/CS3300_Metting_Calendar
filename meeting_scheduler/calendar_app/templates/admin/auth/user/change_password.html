{% extends "admin/auth/user/change_password.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<style>
.password-generate-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 20px;
    background-color: #417690;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.3s;
    text-decoration: none;
}

.password-generate-btn:hover {
    background-color: #2e5266;
}

.password-field-wrapper {
    position: relative;
}
</style>
{% endblock %}

{% block after_field_sets %}
{{ block.super }}
<div class="password-field-wrapper">
    <button type="button" class="password-generate-btn" onclick="generateAdminPassword(this)">
        Generate Secure Password
    </button>
</div>

<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

async function generateAdminPassword(btn) {
    try {
        const csrftoken = getCookie('csrftoken');
        const response = await fetch("/api/generate-password/", {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrftoken
            }
        });
        const data = await response.json();

        if (data.password) {
            // Set both password fields in admin form
            const password1 = document.querySelector('input[name="password1"]');
            const password2 = document.querySelector('input[name="password2"]');

            if (password1) password1.value = data.password;
            if (password2) password2.value = data.password;

            // Show visual feedback
            const originalText = btn.textContent;
            const originalBg = btn.style.backgroundColor;
            btn.textContent = 'Password Generated!';
            btn.style.backgroundColor = '#28a745';

            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.backgroundColor = originalBg;
            }, 2000);
        } else if (data.error) {
            alert('Error generating password: ' + data.error);
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Failed to generate password. Please try again.');
    }
}
</script>
{% endblock %}
